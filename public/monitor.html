<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monitor — 80/20 Launch Audit</title>
<meta name="description" content="Track any app's launch-readiness score over time: weekly re-scan, finding history, and a diff of what broke and what got fixed." />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="/favicon-32.png" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/elite.css" />
<link rel="stylesheet" href="/assets/elite-tokens.css" />
<style>
  :root{--bg:#08080C;--panel:#101017;--panel-2:#17171F;--ink:#F5F6FB;--ink-soft:#C8CBD8;--ink-mut:#9DA1B2;--ink-faint:#8A8FA0;
    --line:rgba(201,206,219,.10);--line-strong:rgba(201,206,219,.17);--accent:#8B92FF;--accent-2:#B79BFF;--accent-3:#5D63D6;--accent-ink:#CFD3FF;--trim:#C9CEDB;
    --green:#4ECB8A;--amber:#E8B14A;--red:#FF7A85;--crit:#FF6472;--info:#6FC7E8;--radius:16px;--maxw:1000px;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -24px rgba(0,0,0,.9);
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-display:"Space Grotesk","Inter",sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent-ink);}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px;}
  header.nav{position:sticky;top:0;z-index:20;background:rgba(8,8,12,.78);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:60px;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;}
  .brand img{height:24px;}
  .brand-word{font-family:var(--font-display);font-size:16px;}
  .nav a.nlink{color:var(--ink-mut);text-decoration:none;font-size:14px;font-weight:500;padding:8px 12px;border-radius:9px;}
  .nav a.nlink:hover{color:var(--ink);background:rgba(255,255,255,.04);}
  h1{font-family:var(--font-display);font-size:clamp(26px,4vw,36px);letter-spacing:-.02em;margin:34px 0 8px;}
  .lede{color:var(--ink-mut);max-width:60ch;margin:0 0 24px;}
  .mform{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;}
  .mform input{flex:1;min-width:260px;padding:13px 15px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(0,0,0,.32);color:var(--ink);font-family:var(--font);font-size:15px;}
  .mform input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-size:14.5px;font-weight:600;text-decoration:none;cursor:pointer;border-radius:11px;padding:12px 18px;border:1px solid transparent;transition:transform .12s,border-color .15s,background .2s;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .btn-primary{color:#fff;background:linear-gradient(135deg,var(--accent-3),var(--accent-2));box-shadow:0 12px 30px -10px rgba(139,146,255,.7);}
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-ghost{color:var(--ink);background:rgba(255,255,255,.035);border:1px solid var(--line-strong);}
  .btn-ghost:hover{border-color:var(--accent);background:rgba(139,146,255,.09);}
  .panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
  .state{color:var(--ink-mut);padding:26px;text-align:center;border:1px solid var(--line);border-radius:14px;background:var(--panel);}
  .state.err{color:#FFAEB6;}
  .head-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .bigscore{font-family:var(--font-display);font-size:52px;font-weight:700;line-height:1;letter-spacing:-.02em;}
  .bigscore small{font-size:18px;color:var(--ink-faint);}
  .band-green .bigscore{color:var(--green);}.band-yellow .bigscore{color:var(--amber);}.band-red .bigscore{color:var(--red);}
  .head-meta{flex:1;min-width:220px;}
  .head-meta .u{font-family:var(--mono);font-size:14px;color:var(--ink-soft);word-break:break-all;}
  .head-meta .when{font-size:12.5px;color:var(--ink-faint);margin-top:4px;}
  .spark{margin-top:8px;}
  .delta{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);}
  .delta.up{color:var(--green);border-color:rgba(78,203,138,.4);}.delta.down{color:var(--red);border-color:rgba(255,122,133,.4);}.delta.flat{color:var(--ink-mut);}
  h2{font-family:var(--font-display);font-size:16px;letter-spacing:-.01em;margin:0 0 12px;}
  .diff-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){.diff-cols{grid-template-columns:1fr;}}
  .diff-col h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mut);margin:0 0 10px;}
  .diff-item{font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink-soft);}
  .diff-item:last-child{border-bottom:0;}
  .diff-item.new{color:#FFAEB6;}.diff-item.fixed{color:#9CE6BF;}
  .fcard{border:1px solid var(--line);border-left:4px solid var(--ink-faint);border-radius:12px;background:var(--panel);padding:14px 16px;margin-bottom:10px;}
  .fcard.sev-critical,.fcard.sev-high{border-left-color:var(--red);}.fcard.sev-medium{border-left-color:var(--amber);}.fcard.sev-low{border-left-color:var(--accent);}
  .fcard-head{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .fcard-sev{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;font-weight:700;}
  .sev-critical .fcard-sev,.sev-high .fcard-sev{color:var(--red);background:rgba(255,122,133,.12);}
  .sev-medium .fcard-sev{color:var(--amber);background:rgba(232,177,74,.12);}
  .sev-low .fcard-sev{color:var(--accent-ink);background:rgba(139,146,255,.12);}
  .fcard-title{font-size:14px;font-weight:650;flex:1;min-width:180px;}
  .fcard-detail{font-size:13px;color:var(--ink-mut);margin:8px 0 0;line-height:1.55;}
  .fcard-fix{margin-top:11px;border:1px solid var(--line);border-radius:9px;background:#0a0b12;overflow:hidden;}
  .fcard-fix summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:center;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--accent-ink);}
  .fcard-fix summary::-webkit-details-marker{display:none;}
  .fix-copy{margin-left:auto;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink-soft);background:rgba(255,255,255,.05);border:1px solid var(--line-strong);border-radius:7px;padding:5px 10px;cursor:pointer;}
  .fix-copy.copied{color:#fff;border-color:rgba(78,203,138,.6);background:rgba(78,203,138,.16);}
  .fix-body{margin:0;padding:0 12px 12px;font-family:var(--mono);font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:#e7e9f5;}
  .enroll{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.enroll{grid-template-columns:1fr;}}
  .enroll label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-mut);}
  .enroll input{padding:11px 13px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(0,0,0,.32);color:var(--ink);font-family:var(--font);font-size:14px;}
  .enroll input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .enroll-foot{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .muted{color:var(--ink-faint);font-size:12.5px;}

  /* ---- elite layer ---- */
  .panel{background:var(--panel);border:0;box-shadow:inset 0 0 0 1px var(--line),0 26px 60px -42px rgba(0,0,0,.8);}
  .state{background:var(--panel);border:0;box-shadow:inset 0 0 0 1px var(--line);}
  .la-what>span{display:block;color:var(--ink-mut);margin-top:3px;font-size:12.5px;line-height:1.55;}
  .la-what b{display:block;color:var(--ink);font-weight:600;}
  .mstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px;}
  .mstat .c{border-radius:12px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line);padding:14px 15px;}
  .mstat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;line-height:1.05;color:var(--ink);}
  .mstat .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mut);margin-top:6px;}
  .m-fixcell details{border-radius:9px;background:rgba(0,0,0,.34);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin-top:8px;}
  .m-fixcell summary{list-style:none;cursor:pointer;padding:8px 11px;font-size:12px;font-weight:600;color:var(--accent-ink);}
  .m-fixcell summary::-webkit-details-marker{display:none;}
  .elite-empty h4{font-family:var(--font-display);font-size:19px;margin:0;color:var(--ink);}
  .elite-empty p{font-size:14px;line-height:1.6;color:var(--ink-soft);max-width:52ch;margin:0;}
  @media (max-width:767px){html,body{overflow-x:clip;max-width:100vw;}}
  /* white-label print masthead */
  .wl-mast{display:none;}
  @media print{
    body{background:#fff;color:#101828;}
    header.nav,.mform,.enroll-panel,.btn,.nav,.no-print{display:none!important;}
    .panel{border:1px solid #e4e7ec;box-shadow:none;background:#fff;}
    .fcard-detail,.head-meta .when,.muted{color:#475467;}
    .fcard-fix{background:#f8fafc;}.fix-body{color:#101828;}
    .wl-mast{display:flex;gap:12px;align-items:center;border-bottom:3px solid #101828;padding-bottom:16px;margin-bottom:20px;}
    .wl-mast img{height:36px;}
    .wl-mast .wl-name{font-family:var(--font-display);font-weight:700;font-size:20px;color:#101828;}
    .wl-mast .wl-sub{color:#475467;font-size:12px;margin-left:auto;text-align:right;}
  }
</style>
</head>
<body>
<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="/"><img src="/logo-80-20.png" alt="80/20" /><span class="brand-word">Launch Audit</span></a>
    <nav class="nav"><a class="nlink" href="/#grade">Grade my app</a><a class="nlink" href="/#order">Order an audit</a></nav>
  </div>
</header>
<main class="wrap">
  <div class="wl-mast" id="wl-mast" aria-hidden="true"></div>
  <h1 class="no-print">Monitor a URL over time</h1>
  <p class="lede no-print">Weekly re-scan, a score history sparkline, and a diff of what broke and what got fixed since last week. Enrol a URL below or open one you already track.</p>
  <form class="mform no-print" id="mform">
    <input type="url" id="murl" inputmode="url" autocomplete="url" placeholder="https://your-app.com" aria-label="URL to monitor" required />
    <button class="btn btn-primary" type="submit">Load history →</button>
  </form>
  <div id="result"></div>
</main>
<script src="/assets/elite-motion.js" defer></script>
<script src="/assets/monitor.js" defer></script>
</body>
</html>
